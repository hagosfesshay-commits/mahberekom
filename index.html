<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#103f38"><title>Eritreanska föreningen i Göteborg med omnejd</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:#193a34;background:#faf9f5;font:17px/1.55 system-ui,sans-serif}header,footer{background:#103f38;color:white}header>div,main,footer>div{max-width:1160px;margin:auto;padding:18px 5%}header>div{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.brand{font:bold 24px Georgia,serif;letter-spacing:.02em;margin-right:auto}a{color:inherit;text-underline-offset:4px}nav{display:flex;gap:15px;flex-wrap:wrap}nav a,header .brand{text-decoration:none}nav a:hover,nav a[aria-current=page]{text-decoration:underline}button,.btn{border:0;border-radius:6px;background:#145248;color:white;display:inline-block;font:inherit;font-weight:600;padding:10px 18px;cursor:pointer;text-decoration:none}header button{background:transparent;border:1px solid #aac6bc;font-size:15px;padding:5px 10px}.hero{margin:24px 0;display:grid;grid-template-columns:1.6fr 1fr;background:#f0e7cf;border-radius:14px;overflow:hidden}.intro{padding:clamp(25px,5vw,65px)}h1,h2,h3{font-family:Georgia,serif;line-height:1.14}h1{font-size:clamp(36px,5vw,64px);margin:12px 0 20px;letter-spacing:-.035em}h2{font-size:32px}h3{font-size:24px}.weave{background-color:#ae583e;background-image:repeating-linear-gradient(45deg,transparent 0 17px,#f6c879 18px 21px,transparent 22px 38px),repeating-linear-gradient(-45deg,transparent 0 17px,#e6ac61 18px 21px,transparent 22px 38px),repeating-linear-gradient(0deg,#803f31 0 72px,#214e43 72px 138px,#ba6743 138px 216px);border-left:10px solid #d9a65a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(225px,100%),1fr));gap:18px}.card,form,article.item{border:1px solid #d3dcd1;border-radius:10px;background:white;padding:24px}.card h3{margin-top:0}.card p{margin:0 0 16px}.date{font-size:15px;color:#6d5034;font-weight:bold}.page{max-width:780px;margin:35px auto}.page h1{font-size:clamp(36px,5vw,48px)}form{display:grid;gap:12px;margin:18px 0}label{display:grid;gap:4px;font-weight:600}input,textarea{font:inherit;border:1px solid #93a59a;border-radius:5px;padding:9px;background:#fff;width:100%;color:inherit}textarea{min-height:90px}button:disabled{opacity:.6}ul{padding-left:22px}.muted,small{color:#486359}footer{margin-top:52px}footer>div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}footer a{font-size:15px}p[role=status]:empty{display:none}p[role=status]{font-weight:600}.actions{display:flex;flex-wrap:wrap;gap:10px}.item{margin:10px 0}.skip{position:absolute;left:-999px}.skip:focus{left:10px;background:white;color:black;padding:10px}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b65c30;outline-offset:3px}@media(max-width:720px){header>div{gap:10px}nav{order:3;width:100%;gap:8px 15px;font-size:15px}.hero{grid-template-columns:1fr}.weave{height:70px;border-left:0}.intro{padding:25px}}
</style></head><body><a class="skip" href="#content">Till innehållet</a><header><div><a class="brand" href="#home">Eritreanska föreningen i Göteborg med omnejd</a><nav aria-label="Meny"></nav><button id="lang"></button></div></header><main id="content" tabindex="-1"></main><footer><div><span>Eritreanska föreningen i Göteborg med omnejd</span><a href="#admin">Styrelseinloggning</a></div></footer>
<script>
const main=document.querySelector('main'),lang=document.querySelector('#lang');
let ti=localStorage.getItem('language')==='ti',adminKey='';
const tr=(sv,t)=>ti?t:sv;
const titles=()=>({home:tr('Startsida','መእተዊ'),about:tr('Om föreningen','ብዛዕባ ማሕበር'),events:tr('Aktiviteter','ንጥፈታት'),member:tr('Bli medlem','ኣባል ኩን'),booking:tr('Boka lokalen','ኣዳራሽ ሓዝ'),contact:tr('Kontakt','ርኸቡና')});
function el(tag,text,parent){const e=document.createElement(tag);e.textContent=text;if(parent)parent.append(e);return e}
function link(id,text){return '<a class="btn" href="#'+id+'">'+text+'</a>'}
function card(id,body){return '<article class="card"><h3>'+titles()[id]+'</h3><p>'+body+'</p><a href="#'+id+'">'+tr('Läs mer','ተወሳኺ ኣንብብ')+'</a></article>'}
function events(){return '<p>'+tr('Föreningen har ännu inte publicerat några aktiviteter här.','ኣብዚ ገጽ ገና ዝተዘርግሑ መደባት የለዉን።')+'</p>'}
function field(name,label,type,options=''){return '<label>'+label+'<input required name="'+name+'" type="'+type+'" '+options+'></label>'}
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Stockholm'}).format(new Date());
async function api(path,data,key){const headers={};if(key)headers.Authorization='Bearer '+key;if(data)headers['Content-Type']='application/json';const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers,body:data?JSON.stringify(data):undefined,cache:'no-store'});if(!r.headers.get('content-type')?.includes('application/json'))throw Error(tr('Tjänsten är inte aktiverad.','እቲ ኣገልግሎት ገና ኣይጀመረን።'));const v=await r.json();if(!r.ok)throw Error(v.error);return v}
function publicForm(kind){
 const booking=kind==='booking';
 const intro={booking:tr('Välj ett datum och se upptagna tider. Styrelsen återkommer med pris, villkor och besked innan din bokning är bekräftad.','ዕለት ምረጹ፡ ዝተሓዙ ሰዓታት ርኣዩ። ሽማግለ ብዛዕባ ዋጋን ቅድመ ኩነታትን ክትሕብረኩም እያ።'),member:tr('Anmäl ditt intresse så hör styrelsen av sig om medlemskap och aktuell avgift.','ኣባል ክትኮኑ ድሌትኩም ኣፍልጡ። ሽማግለ ብዛዕባ ኣባልነትን ክፍሊትን ክትሕብረኩም እያ።'),contact:tr('Skriv din fråga till styrelsen. Ange den e-postadress där du vill få svar.','ሕቶኹም ናብ ሽማግለ ጽሓፉ። መልሲ ንምቕባል ኢመይልኩም ኣእትዉ።')};
 let html='<p>'+intro[kind]+'</p><form id="request">';
 if(booking)html+=field('day',tr('Datum','ዕለት'),'date','min="'+today()+'" value="'+today()+'"')+'<div id="busy" aria-live="polite"></div><div class="grid">'+field('start',tr('Från','ካብ'),'time')+field('end',tr('Till','ክሳብ'),'time')+'</div>'+field('guests',tr('Antal gäster','ብዝሒ ኣጋይሽ'),'number','min="1" max="9999"');
 html+=field('name',tr('Ditt namn','ስምኩም'),'text','maxlength="100" autocomplete="name"')+field('email',tr('Din e-postadress','ኢመይልኩም'),'email','maxlength="200" autocomplete="email"');
 if(kind!=='member')html+='<label>'+ (booking?tr('Vad planerar du för arrangemang?','እንታይ ዓይነት መደብ ኢኹም እትዳለዉ?'):tr('Meddelande','መልእኽቲ'))+'<textarea required name="note" maxlength="1000"></textarea></label>';
 html+='<small>'+tr('Styrelsen använder uppgifterna för att hantera ditt ärende och svara via e-post.','ሽማግለ ነቲ ሓበሬታ ንሕቶኹም ንምክትታልን ብኢመይል ንምምላስን ትጥቀመሉ።')+'</small><button>'+tr('Skicka förfrågan','ሕቶ ስደዱ')+'</button><p role="status"></p></form>';
 return html;
}
async function wireForm(kind){
 const f=document.querySelector('#request'),msg=f.querySelector('[role=status]'),btn=f.querySelector('button');
 if(kind==='booking'){
 const day=f.elements.day,box=f.querySelector('#busy');
 const check=async()=>{try{const rows=await api('calendar');const times=rows.filter(x=>x.day===day.value).map(x=>x.start+'–'+x.end);box.textContent=times.length?tr('Upptaget: ','ዝተሓዘ፡ ')+times.join(', '):tr('Inga bekräftade bokningar denna dag.','ኣብዛ ዕለት ዝተረጋገጸ ቦታ የለን።')}catch(e){box.textContent=e.message}};
 day.onchange=check;check();}
 f.onsubmit=async e=>{e.preventDefault();btn.disabled=true;try{const data=Object.fromEntries(new FormData(f));const v=await api('request',{...data,kind});f.reset();msg.textContent=tr('Tack! Din förfrågan har sparats. Referens: ','የቐንየልና! ሕቶኹም ተመዝጊቡ። ቁጽሪ፡ ')+v.reference;if(kind==='booking')f.elements.day.onchange()}catch(err){msg.textContent=err.message}finally{btn.disabled=false}};
}
async function admin(){
 main.innerHTML='<section class="page"><h1>Styrelsens ärenden</h1><form id="login">'+field('key','Styrelsens åtkomstnyckel','password','autocomplete="current-password"')+'<button>Visa ärenden</button></form><p role="status"></p><div id="records"></div></section>';
 const form=document.querySelector('#login'),status=main.querySelector('[role=status]'),records=document.querySelector('#records');
 async function refresh(){try{const rows=await api('admin',null,adminKey);form.hidden=true;form.style.display='none';records.replaceChildren();const out=el('button','Logga ut',records);out.onclick=()=>{adminKey='';admin()};status.textContent=rows.length+' ärenden';for(const r of rows){const box=el('article','',records);box.className='item';el('h3',({booking:'Lokalbokning',member:'Medlemskap',contact:'Kontakt'})[r.kind]+' · '+r.status,box);el('p',r.name+' · '+r.email+' · '+r.id.slice(0,8),box);if(r.day)el('p',r.day+' '+r.start+'–'+r.end+' · '+r.guests+' gäster',box);el('p',r.note,box);const mail=el('a','Svara via e-post',box);mail.href='mailto:'+encodeURIComponent(r.email)+'?subject='+encodeURIComponent('Eritreanska föreningen i Göteborg med omnejd · '+r.id.slice(0,8));const actions=el('p','',box);actions.className='actions';for(const action of [...(r.status==='Ny'?(r.kind==='booking'?['Godkänd','Avslagen']:['Besvarad']):[]),'Radera']){const b=el('button',({Godkänd:'Godkänn',Avslagen:'Avslå','Besvarad':'Markera besvarad'})[action]||action,actions);b.onclick=async()=>{if(action==='Radera'&&!confirm('Radera detta ärende?'))return;b.disabled=true;try{await api('admin',{id:r.id,action},adminKey);await refresh()}catch(e){status.textContent=e.message;b.disabled=false}}}}}catch(e){status.textContent=e.message}}
 form.onsubmit=e=>{e.preventDefault();adminKey=form.elements.key.value;form.reset();refresh()};if(adminKey)refresh();
}
function render(){
 const associationName=tr('Eritreanska föreningen i Göteborg med omnejd','ማሕበር ኤርትራውያን ኣብ ዮተቦሪን ከባቢኣን');document.title=associationName;document.querySelector('.brand').textContent=associationName;document.querySelector('footer span').textContent=associationName;
 document.documentElement.lang=ti?'ti':'sv';lang.textContent=ti?'Svenska':'ትግርኛ';const names=titles(),id=location.hash.slice(1)||'home';document.querySelector('nav').innerHTML=Object.entries(names).map(([k,v])=>'<a '+(id===k?'aria-current="page"':'')+' href="#'+k+'">'+v+'</a>').join('');
 if(id==='admin'){admin();return}adminKey='';
 if(id==='home'||!Object.hasOwn(names,id)){main.innerHTML='<section class="hero"><div class="intro"><h1>'+tr('Eritreanska föreningen i Göteborg med omnejd','ማሕበር ኤርትራውያን ኣብ ዮተቦሪን ከባቢኣን')+'</h1><p>'+tr('Välkommen! Här hittar du information om medlemskap, aktiviteter och lokalbokning.','እንቋዕ ብደሓን መጻእኩም። ኣብዚ ብዛዕባ ኣባልነት፡ ንጥፈታትን ምሕዛእ ኣዳራሽን ሓበሬታ ትረኽቡ።')+'</p>'+link('booking',names.booking)+'</div><div class="weave" aria-hidden="true"></div></section><div class="grid">'+card('events',tr('Se föreningens program.','መደባት ማሕበር ርኣዩ።'))+card('member',tr('Ta första steget och anmäl ditt intresse.','ኣባል ክትኮኑ ድሌትኩም ኣፍልጡ።'))+card('contact',tr('Skicka en fråga till styrelsen.','ሕቶኹም ናብ ሽማግለ ስደዱ።'))+'</div>';return}
 let body='';
 if(id==='about')body='<p>'+tr('För frågor om Eritreanska föreningen i Göteborg med omnejd eller om hur du blir medlem, kontakta styrelsen.','ብዛዕባ ማሕበርና ወይ ኣባልነት ሕቶ እንተ ኣለኩም፡ ምስ ሽማግለ ተራኸቡ።')+'</p>'+link('contact',names.contact);
 else if(id==='events')body='<div class="grid">'+events()+'</div>';else body=publicForm(id);
 main.innerHTML='<section class="page"><h1>'+names[id]+'</h1>'+body+'</section>';
 if(['member','contact','booking'].includes(id))wireForm(id);
}
lang.onclick=()=>{ti=!ti;localStorage.setItem('language',ti?'ti':'sv');render()};window.onhashchange=()=>{render();window.scrollTo(0,0);main.focus()};render();
</script></body></html>
